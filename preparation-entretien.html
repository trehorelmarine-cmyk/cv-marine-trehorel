<!DOCTYPE html>
<html lang="fr"><head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Préparation entretien — Marine Tréhorel</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      min-height: 100%;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #2b2622;
      background: #f6efe4;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background:
        radial-gradient(circle at 12% 10%, rgba(201, 117, 90, 0.09), transparent 40%),
        radial-gradient(circle at 88% 90%, rgba(165, 69, 39, 0.07), transparent 45%),
        #f6efe4;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 12px 32px;
      background: rgba(246, 239, 228, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e4d8c6;
    }

    .topbar .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-left: 40px;
      text-decoration: none;
      color: inherit;
    }

    .topbar .logo .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #a54527;
      color: #f6efe4;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 21px;
      font-weight: 700;
      line-height: 1;
      transition: background 0.2s ease;
    }

    .topbar .logo:hover .mark { background: #c9755a; }

    .topbar nav {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .topbar nav a {
      font-size: 13px;
      font-weight: 500;
      color: #6b6560;
      text-decoration: none;
      padding: 3px 0;
      border-bottom: 1.5px solid transparent;
      transition: color 0.2s ease;
    }

    .topbar nav a:hover { color: #a54527; }

    .topbar nav a.active {
      color: #a54527;
      font-weight: 600;
      border-bottom-color: #c9755a;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 64px 32px 96px;
    }

    .page-head { margin-bottom: 48px; }

    .page-head h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 700;
      line-height: 1.12;
    }

    section { margin-bottom: 56px; }

    section > h2 {
      display: flex;
      align-items: baseline;
      gap: 12px;
      font-family: 'Playfair Display', serif;
      font-size: 27px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    section > h2 .idx {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #c9755a;
    }

    /* --- Listes de liens --- */
    .link-list { list-style: none; }

    .link-list li { border-top: 1px solid #e4d8c6; }
    .link-list li:last-child { border-bottom: 1px solid #e4d8c6; }

    .link-list a {
      display: flex;
      align-items: baseline;
      gap: 18px;
      padding: 18px 4px;
      text-decoration: none;
      color: inherit;
    }

    .link-list .date {
      flex: 0 0 108px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #c9755a;
      white-space: nowrap;
    }

    .link-list .body { flex: 1; }

    .link-list .title {
      display: block;
      font-family: 'Playfair Display', serif;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.3;
    }

    .link-list .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .link-list .tags span {
      font-size: 11.5px;
      font-weight: 500;
      color: #8a6b4f;
      background: #f2e4d3;
      border-radius: 20px;
      padding: 4px 11px;
      white-space: nowrap;
    }

    .link-list .arrow {
      flex: 0 0 auto;
      align-self: center;
      color: #a54527;
      opacity: 0.55;
    }

    .link-list .arrow svg { width: 17px; height: 17px; display: block; }

    .empty {
      font-size: 14px;
      color: #9a938c;
      font-style: italic;
      padding: 18px 0;
      border-top: 1px solid #e4d8c6;
      border-bottom: 1px solid #e4d8c6;
    }

    /* --- Blocs (identiques à la page d'accueil) --- */
    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: #fbf5ea;
      border: 1px solid #e4d8c6;
      border-radius: 18px;
      padding: 28px 32px 26px;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: border-color 0.25s ease;
    }

    .card:hover { border-color: #c9755a; }

    .card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card .desc {
      font-size: 14px;
      color: #6b6560;
      line-height: 1.6;
      margin-bottom: 24px;
      flex-grow: 1;
    }

    .card .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #a54527;
    }

    .card .cta svg {
      width: 20px;
      height: 20px;
      transition: transform 0.25s ease;
    }

    .card:hover .cta svg { transform: translateX(4px); }

    @media (max-width: 640px) {
      .cards { grid-template-columns: 1fr; gap: 20px; }
      .topbar { padding: 10px 18px; gap: 14px; }
      .topbar .back { left: 12px; }
      .topbar nav { gap: 16px; }
      main { padding: 44px 20px 72px; }
      .page-head h1 { font-size: 32px; }
      .link-list a { flex-wrap: wrap; gap: 4px 14px; padding: 16px 4px; }
      .link-list .date { flex-basis: 100%; }
    }
  </style>
</head>
