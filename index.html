<!DOCTYPE html>
<html lang="fr"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marine Tréhorel — Accueil</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #2b2622;
      background: #f6efe4;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 48px 24px;
      background:
        radial-gradient(circle at 15% 15%, rgba(201, 117, 90, 0.10), transparent 42%),
        radial-gradient(circle at 85% 85%, rgba(165, 69, 39, 0.08), transparent 45%),
        #f6efe4;
    }

    .hero {
      text-align: center;
      max-width: 640px;
      margin-bottom: 56px;
    }

    .hero .photo {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 38%;
      border: 3px solid #fbf5ea;
      box-shadow: 0 6px 24px rgba(165, 69, 39, 0.18);
      margin-bottom: 24px;
    }

    .hero .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #c9755a;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 46px;
      font-weight: 700;
      line-height: 1.1;
      color: #2b2622;
      margin-bottom: 14px;
    }

    .hero p {
      font-size: 15px;
      color: #6b6560;
      line-height: 1.7;
      max-width: 520px;
      margin: 0 auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
      width: 100%;
      max-width: 780px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      background: #fbf5ea;
      border: 1px solid #e4d8c6;
      border-radius: 18px;
      padding: 36px 32px 30px;
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: border-color 0.25s ease;
    }

    .card:hover {
      border-color: #c9755a;
    }

    .card .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #f2e4d3;
      color: #a54527;
      margin-bottom: 22px;
    }

    .card .icon svg {
      width: 26px;
      height: 26px;
    }

    .card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card .desc {
      font-size: 14px;
      color: #6b6560;
      line-height: 1.6;
      margin-bottom: 24px;
      flex-grow: 1;
    }

    .card .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
      color: #a54527;
    }

    .card .cta svg {
      width: 16px;
      height: 16px;
      transition: transform 0.25s ease;
    }

    .card:hover .cta svg {
      transform: translateX(4px);
    }

    footer.social {
      margin-top: 56px;
      display: flex;
      gap: 28px;
      align-items: center;
    }

    footer.social a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.3px;
      color: #6b6560;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    footer.social a svg {
      width: 18px;
      height: 18px;
    }

    footer.social a:hover {
      color: #a54527;
    }

    @media (max-width: 640px) {
      .hero h1 { font-size: 34px; }
      .cards { grid-template-columns: 1fr; gap: 20px; }
      body { padding: 40px 20px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <img class="photo" src="/Portrait-MARINE.jpg" alt="Marine Tréhorel">
    <p class="eyebrow">Product Owner · Cheffe de projet digital</p>
    <h1>Marine Tréhorel</h1>
    <p>Prochain entretien en vue ? On révise, on respire, on assure. Tout est prêt : CV et fiches de prépa. Le job idéal n'a qu'à bien se tenir.</p>
  </header>

  <main class="cards">
    <a class="card" href="/product-owner-cheffe-de-projet-digital.html">
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>
      </span>
      <h2>Mon CV</h2>
      <span class="cta">Consulter
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </span>
    </a>

    <a class="card" href="/preparation-entretien.html">
      <span class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
      </span>
      <h2>Préparation entretien</h2>
      <span class="cta">Préparer
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </span>
    </a>
  </main>

  <footer class="social">
    <a href="https://www.linkedin.com/feed/" target="_blank" rel="noopener">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14zM8.34 9.5H5.67V18h2.67V9.5zM7 6.15a1.55 1.55 0 1 0 0 3.1 1.55 1.55 0 0 0 0-3.1zM18.33 18v-4.66c0-2.49-1.33-3.65-3.1-3.65-1.43 0-2.07.79-2.43 1.34V9.5h-2.67V18h2.67v-4.5c0-1.19.22-2.34 1.7-2.34 1.45 0 1.47 1.36 1.47 2.42V18h2.36z"></path></svg>
      LinkedIn
    </a>
    <a href="https://app.collective.work/" target="_blank" rel="noopener">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"><path d="M18.5 7.4 A 8 8 0 1 0 18.5 16.6" stroke="currentColor" stroke-width="3.6" stroke-linecap="round"></path><circle cx="12" cy="12" r="3" fill="currentColor"></circle></svg>
      Collective Work
    </a>
  </footer>

</body>
</html>
